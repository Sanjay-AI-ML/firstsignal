name: FindIn checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: findin-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
      SHARP_IGNORE_GLOBAL_LIBVIPS: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install exact lockfile dependencies
        run: npm ci --include=dev --include=optional --no-audit --no-fund
      - name: Check application TypeScript
        run: npm run typecheck
      - name: Run isolated regressions
        run: npm test
      - name: Check dispatcher TypeScript
        run: node node_modules/typescript/bin/tsc --project cloudflare/notification-dispatcher/tsconfig.json
      - name: Verify mocked dispatcher behavior
        run: npm run test:dispatcher
      - name: Build application
        run: npm run build
